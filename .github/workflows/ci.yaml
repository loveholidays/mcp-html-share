name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.2'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        go mod download
        make tools

    - name: Run linting and checks
      run: make check

    - name: Run tests
      run: make test

    - name: Convert coverage to LCOV
      run: |
        go run github.com/jandelgado/gcov2lcov@v1.1.1 -infile=coverage.out -outfile=coverage.lcov
        python3 - <<'PY'
        from pathlib import Path
        report = Path("coverage.lcov")
        report.write_text(report.read_text().replace(f"SF:{Path.cwd()}/", "SF:"))
        PY

    - name: Install CodeScene coverage CLI
      run: |
        curl -fsSL https://downloads.codescene.io/enterprise/cli/cs-coverage-linux-amd64-992b0e502d0bfa91ee399aa73d44bc380de3e866.zip -o "$RUNNER_TEMP/cs-coverage.zip"
        echo "73d0db846505cb2e93a8a6b453b8a05f59c8fced649dbd8660d2258c204595b8  $RUNNER_TEMP/cs-coverage.zip" | sha256sum --check
        unzip -p "$RUNNER_TEMP/cs-coverage.zip" cs-coverage > "$RUNNER_TEMP/cs-coverage"
        chmod +x "$RUNNER_TEMP/cs-coverage"

    - name: Check CodeScene coverage
      if: github.event_name == 'pull_request'
      env:
        CS_ACCESS_TOKEN: ${{ secrets.CS_TOKEN }}
      run: '"$RUNNER_TEMP/cs-coverage" check --project-url https://api.codescene.io/v2/projects/66419 --coverage-files coverage.lcov'

    - name: Upload CodeScene coverage
      if: github.event_name == 'push'
      env:
        CS_ACCESS_TOKEN: ${{ secrets.CS_TOKEN }}
      run: '"$RUNNER_TEMP/cs-coverage" upload --format lcov --metric line-coverage coverage.lcov'

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/loveholidays/mcp-html-share
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
