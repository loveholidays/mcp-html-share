name: CodeScene coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codescene-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install coverage verification dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/coverage/requirements.txt
      - name: Test coverage verification
        run: python -m coverage run --source=scripts -m unittest discover -s scripts -p 'test_*.py'
      - name: Collect and verify full coverage report
        run: |
          make coverage
          python -m coverage run --append --source=scripts scripts/coverage_report.py
          python -m coverage lcov -o tooling.info
          git diff --exit-code
          git rev-parse HEAD > coverage.sha
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            coverage.out
            coverage.info
            coverage.sha
            tooling.info
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  codescene:
    name: CodeScene coverage check
    if: always()
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Require successful report production
        env:
          PRODUCER_RESULT: ${{ needs.coverage.result }}
        run: test "$PRODUCER_RESULT" = success
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify report head
        run: |
          test "$(cat coverage.sha)" = "$HEAD_SHA"
          test -s coverage.info
          test -s tooling.info
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install verdict reader
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/coverage/requirements.txt
      - name: Install pinned CodeScene coverage CLI
        env:
          CLI_URL: https://downloads.codescene.io/enterprise/cli/cs-coverage-linux-amd64-992b0e502d0bfa91ee399aa73d44bc380de3e866.zip
        run: |
          curl --fail --silent --show-error --location --retry 3 "$CLI_URL" --output "$RUNNER_TEMP/cs-coverage.zip"
          echo "73d0db846505cb2e93a8a6b453b8a05f59c8fced649dbd8660d2258c204595b8  $RUNNER_TEMP/cs-coverage.zip" | sha256sum --check
          mkdir "$RUNNER_TEMP/codescene-coverage"
          unzip -q "$RUNNER_TEMP/cs-coverage.zip" -d "$RUNNER_TEMP/codescene-coverage"
          chmod +x "$RUNNER_TEMP/codescene-coverage/cs-coverage"
          echo "$RUNNER_TEMP/codescene-coverage" >> "$GITHUB_PATH"
      - name: Require CodeScene upload credential
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_TOKEN }}
        run: |
          if [ -z "$CS_ACCESS_TOKEN" ]; then
            echo '::error::A repository-scoped CS_TOKEN is required for this public repository.'
            exit 1
          fi
      - name: Run native PR coverage policy
        if: github.event_name == 'pull_request'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_TOKEN }}
          CS_DISABLE_VERSION_CHECK: '1'
        run: |
          log="$RUNNER_TEMP/codescene-coverage-check.log"
          cs-coverage check --project-id 66419 --verbose --coverage-files 'coverage.info;tooling.info' > "$log" 2>&1 || { cat "$log"; exit 1; }
          cat "$log"
          python scripts/codescene_verdict.py "$log" "$HEAD_SHA" "$BASE_REF"
      - name: Verify native GitHub coverage result
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in {1..30}; do
            gh api --paginate "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/codescene-checks.json"
            result=$(jq -sr --arg name "CodeScene Code Coverage ($BASE_REF)" \
              '[.[].check_runs[] | select(.name == $name and .app.slug == "codescene-access" and .app.id == 3755875)] | sort_by(.id) | last | .conclusion // "pending"' \
              "$RUNNER_TEMP/codescene-checks.json")
            if [ "$result" = success ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Native CodeScene coverage did not succeed: $result"
          exit 1
      - name: Upload main coverage for scheduled analysis
        if: github.event_name == 'push'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_TOKEN }}
          CS_DISABLE_VERSION_CHECK: '1'
        run: |
          cs-coverage upload --format lcov --metric line-coverage coverage.info
          cs-coverage upload --format lcov --metric line-coverage tooling.info
